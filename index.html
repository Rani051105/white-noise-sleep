<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#EFE8F7">
  <title>Lelap</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main class="app">
    <header class="head">
      <h1>Lelap</h1>
      <p>Suara tenang untuk malam yang pelan.</p>
    </header>

    <section class="stage" aria-label="Pemutar">
      <button id="playBtn" class="play" aria-label="Putar suara" aria-pressed="false">
        <span class="ring r1"></span><span class="ring r2"></span>
        <svg class="ico-play" viewBox="0 0 24 24" width="38" height="38"><path d="M8 5.5v13a1 1 0 0 0 1.5.86l10.5-6.5a1 1 0 0 0 0-1.72L9.5 4.64A1 1 0 0 0 8 5.5z" fill="currentColor"/></svg>
        <svg class="ico-pause" viewBox="0 0 24 24" width="38" height="38"><rect x="6.5" y="5" width="4" height="14" rx="1.5" fill="currentColor"/><rect x="13.5" y="5" width="4" height="14" rx="1.5" fill="currentColor"/></svg>
      </button>
      <h2 id="nowName">Hujan</h2>
      <p id="nowStatus" class="status">Siap diputar</p>
      <p id="timerInfo" class="timer-info" aria-live="polite"></p>

      <label class="vol">
        <span>Volume</span>
        <input id="vol" type="range" min="0" max="100" value="70" aria-label="Volume">
      </label>
    </section>

    <section aria-labelledby="hSound">
      <h3 id="hSound">Pilih suara</h3>
      <div id="sounds" class="sounds" role="radiogroup"></div>
    </section>

    <section aria-labelledby="hTimer">
      <h3 id="hTimer">Berhenti otomatis</h3>
      <div id="timers" class="timers" role="radiogroup"></div>
    </section>
  </main>
  <script src="js/app.js"></script>
</body>
</html>
